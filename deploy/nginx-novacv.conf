# ── Nginx reverse proxy pour NovaCV (VPS Hostinger) ─────────────────────────
# Copier dans /etc/nginx/sites-available/novacv puis :
#   ln -s /etc/nginx/sites-available/novacv /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Remplacer cv.example.com par votre domaine.

server {
    listen 80;
    listen [::]:80;
    server_name cv.example.com;

    # Les URL virales /@pseudo passent par ce proxy sans config spéciale.
    client_max_body_size 10M;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Cache long pour les assets statiques Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable";
    }
}

# HTTPS : après le premier déploiement HTTP, lancer :
#   apt install certbot python3-certbot-nginx -y
#   certbot --nginx -d cv.example.com
# Certbot réécrira ce bloc avec le SSL (renouvellement auto).
